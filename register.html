<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Service Provider</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <h2>CommunityHub</h2>

    <nav class="navbar">
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="register.html">Register</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1>Register as a Service Provider</h1>
    <p>Join the community and offer your services.</p>
  </section>

  <!-- REGISTER FORM -->
  <section class="register-section">

    <form class="register-form" id="registerForm">

      <!-- PASSPORT PHOTO -->
      <div class="profile-upload">
        <img src="images/default-user.png" id="previewImage" alt="Profile Preview">

        <input type="file" id="profilePhoto" accept="image/*">
      </div>

      <!-- FULL NAME -->
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="fullName" placeholder="Enter full name" required>
      </div>

      <!-- PHONE -->
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="phone" placeholder="07XXXXXXXX" required>
      </div>

      <!-- EMAIL -->
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="example@gmail.com">
      </div>

      <!-- SERVICE -->
      <div class="form-group">
        <label>Service Offered</label>

        <select required>
          <option value="">Select Service</option>
          <option>Plumbing</option>
          <option>Electrical</option>
          <option>Cleaning</option>
          <option>Painting</option>
          <option>Carpentry</option>
          <option>Photography</option>
        </select>
      </div>

      <!-- COUNTY -->
      <div class="form-group">
        <label>County</label>

        <select id="county" required>
          <option value="">Select County</option>
          <option value="Nairobi">Nairobi</option>
          <option value="Kiambu">Kiambu</option>
          <option value="Nakuru">Nakuru</option>
        </select>
      </div>

      <!-- SUB COUNTY -->
      <div class="form-group">
        <label>Sub-County</label>

        <select id="subCounty" required>
          <option value="">Select Sub-County</option>
        </select>
      </div>

      <!-- DESCRIPTION -->
      <div class="form-group">
        <label>About Your Service</label>

        <textarea rows="5" placeholder="Describe your service"></textarea>
      </div>

      <!-- BUTTON -->
      <button type="submit" class="btn">
        Register Service
      </button>

    </form>

  </section>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2026 Community Service Hub. All Rights Reserved.</p>
  </footer>

  <script src="js/register.js"></script>

</body>
</html>
